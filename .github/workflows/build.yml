name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
env:
  PDF_URL: https://tablighi-jamaat.b-cdn.net/wp-content/uploads/2023/10/Fazail-Amal-English.pdf
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zip
          pip install pypdf
      - name: Get the book PDF
        run: |
          if [ ! -f book.pdf ]; then
            curl -fL --retry 3 -A "Mozilla/5.0" -o book.pdf "$PDF_URL"
          fi
          ls -la book.pdf
      - name: Build
        run: VERSION_CODE=${{ github.run_number }} ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FazailEAmaal-apk
          path: FazailEAmaal.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" FazailEAmaal.apk --title "Fazail-e-Amaal v1.${{ github.run_number }}" --notes "Automated build"
